name: wisperbot_chat
description: A customizable Flutter SDK for adding WisperBot customer chat to mobile, web, and desktop apps.
repository: https://github.com/Netro-Systems/wisperbot_chat
version: 0.1.2

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  crypto: ^3.0.7
  dart_pusher_channels: ^1.3.1
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  just_audio: ^0.10.5
  logger: ^2.7.0
  onesignal_flutter: ^5.6.6
  record: ^7.1.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icons/
