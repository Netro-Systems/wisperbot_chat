name: wisperbot_chat_example
description: Demonstrates the WisperBot Flutter chat SDK integration surfaces.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  image_picker: '>=1.1.2 <1.2.0'
  record: '>=6.0.0 <6.1.0'
  wisperbot_chat:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
